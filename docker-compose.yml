services:
  # ── Dedicated RecoverAI Backend Service ──
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: recoverai-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - FRONTEND_URL=http://localhost:3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - DEMO_TRIGGER_SECRET=${DEMO_TRIGGER_SECRET:-demo-secret-recoverai-2026}
    volumes:
      - recoverai-db:/app/prisma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Dedicated RecoverAI Frontend Service ──
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: recoverai-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - PORT=3000
      - NODE_ENV=production
      - BACKEND_API_URL=http://backend:4000
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:4000
      - DEMO_TRIGGER_SECRET=${DEMO_TRIGGER_SECRET:-demo-secret-recoverai-2026}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/dashboard"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  recoverai-db:
    driver: local
